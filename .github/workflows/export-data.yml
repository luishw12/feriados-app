name: Exportar dados abertos

# Copia o banco de produção para data/seed/ (dataset versionado e seed do dev local).
on:
  schedule:
    - cron: '17 6 * * *' # todo dia às 03:17 (Brasília)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    if: ${{ vars.EXPORT_ENABLED == 'true' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run db:export
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
      - name: Commit se houver mudanças
        run: |
          if git diff --quiet -- data/seed; then
            echo "Sem mudanças"
            exit 0
          fi
          git config user.name "feriados-bot"
          git config user.email "feriados-bot@users.noreply.github.com"
          git add data/seed
          git commit -m "data: exportação diária do banco ($(date -u +%Y-%m-%d))"
          git push
