name: Contribuição de usuário
description: Referência para pull requests criados pelo formulário do site (não usar manualmente)
title: "[contribuição]: "
labels:
  - contribution
body:
  - type: markdown
    attributes:
      value: |
        Pull requests com este padrão são criados **automaticamente** pelo formulário de contribuição do site.
        Para contribuir, use o botão "Faltou algum feriado?" no rodapé ou os botões nas páginas de feriado.

        Se você é mantenedor, revise o PR, valide fontes e dados, e faça merge se estiver correto.
        Adicione `contributors` no artigo se o usuário autorizou crédito público.
